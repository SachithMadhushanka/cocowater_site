{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - CocoWater</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
</head>
<body class="bg-blue-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-green-700">Login to CocoWater</h2>
        {% if form.errors %}
            <p class="text-red-600 mb-4">Invalid username or password. Please try again.</p>
        {% endif %}
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="id_username" class="block text-left">Username</label>
                {{ form.username }}
            </div>
            <div>
                <label for="id_password" class="block text-left">Password</label>
                {{ form.password }}
            </div>
            <button type="submit" class="bg-green-700 text-white px-4 py-2 rounded hover:bg-green-800 w-full">Login</button>
        </form>
    </div>
</body>
</html>
