{% extends "store/base.html" %}
{% load static %}

{% block content %}
<div class="max-w-2xl mx-auto mt-16 p-8 bg-white shadow-md rounded-xl text-center">
    <div class="text-red-500 mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M12 4v1m0 14v1m8.49-4.49L18 13m0 0l-2.49-2.49M18 13H6" />
        </svg>
    </div>
    <h2 class="text-2xl font-semibold text-gray-800 mb-4">Payment Failed</h2>
    <p class="text-gray-600 mb-6">
        {% if message %}
            {{ message }}
        {% else %}
            Something went wrong during the checkout process. Please try again or use a different payment method.
        {% endif %}
    </p>
    <a href="{% url 'cart' %}" class="inline-block px-6 py-3 bg-red-500 text-white rounded-lg hover:bg-red-600 transition">
        Return to Cart
    </a>
</div>
{% endblock %}
